<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Deadline</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f5;font-family:Arial,sans-serif}main{max-width:500px;margin:auto;padding:32px 18px}.logo{font-size:31px;font-weight:700}.sub{color:#666;margin:7px 0 34px;font-size:13px}button,input{font:inherit}button{border:0}.new{width:100%;height:60px;border-radius:19px;background:#eee;color:#050505;font-weight:650;margin-bottom:34px}.title{font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}.empty{text-align:center;color:#444;padding:48px 20px;font-size:13px}.card{width:100%;background:#101010;border:1px solid #1d1d1d;border-radius:21px;padding:18px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.name{font-weight:600}.date{color:#666;font-size:12px;margin-top:7px}.days{color:#eee;font-size:20px}.modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(430px,100%);background:#151515;border:1px solid #292929;border-radius:27px;padding:24px}.box h2{margin:0 0 23px}.field{margin-bottom:17px}.field label{display:block;color:#666;font-size:10px;letter-spacing:1px;margin-bottom:8px}.field input{width:100%;height:55px;border-radius:16px;border:1px solid #292929;background:#090909;color:#fff;padding:0 15px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.actions button{height:52px;border-radius:16px;background:#111;color:#aaa;border:1px solid #252525}.actions .primary{background:#eee;color:#050505;font-weight:650}</style></head><body><main><div class="logo">Deadline</div><div class="sub">Make your time count.</div><button class="new" id="newBtn">+ Create a new goal</button><div class="title">Your goals</div><div id="goals"><div class="empty">No goals yet.<br>Create your first goal.</div></div></main><div class="modal" id="modal"><div class="box"><h2>Create a new goal</h2><div class="field"><label>GOAL</label><input id="goal" placeholder="e.g. Finish Class 12"></div><div class="field"><label>DEADLINE</label><input id="date" type="date"></div><div class="actions"><button id="cancel">Cancel</button><button class="primary" id="save">Create goal</button></div></div></div><script>const modal=document.getElementById('modal'),goal=document.getElementById('goal'),date=document.getElementById('date'),list=document.getElementById('goals');let goals=JSON.parse(localStorage.getItem('goals')||'[]');function render(){if(!goals.length){list.innerHTML='<div class="empty">No goals yet.<br>Create your first goal.</div>';return}list.innerHTML=goals.map((g,i)=>{let d=Math.ceil((new Date(g.date+'T23:59:59')-Date.now())/86400000);return `<div class="card"><div><div class="name">${escapeHtml(g.name)}</div><div class="date">${g.date}</div></div><div class="days">${Math.max(0,d)}d</div></div>`}).join('')}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('newBtn').onclick=()=>{modal.classList.add('show');goal.focus()};document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('save').onclick=()=>{if(!goal.value.trim()||!date.value){alert('Enter a goal and deadline');return}goals.push({name:goal.value.trim(),date:date.value});localStorage.setItem('goals',JSON.stringify(goals));goal.value='';date.value='';modal.classList.remove('show');render()};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};render();</script></body></html>
